name: Copy Static Assets to Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-assets.yml'
  workflow_dispatch:

jobs:
  copy-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy binary assets from static/ to pages/
        run: |
          cp static/Ralph.mp3 pages/Ralph.mp3
          cp static/center-image.png pages/center-image.png
          cp static/background.jpg pages/background.jpg
      
      - name: Check for changes
        id: check
        run: |
          git diff --quiet pages/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/Ralph.mp3 pages/center-image.png pages/background.jpg
          git commit -m "Sync binary assets from static/ to pages/"
          git push
